# Remote CI-гейт (t6 · Волна 4.3 · 00-CONTRACT §8.9).
# ЗЕРКАЛИТ единый локальный `scripts/check.sh` (ruff → pytest → web typecheck → vitest)
# — анти-дрейф local↔remote: тот же скрипт, что разработчик гоняет перед коммитом.
#
# Отличие от голого скелета (w3-19): перед check.sh собираем `make db`, чтобы
# интеграционные тесты на собранной DuckDB (фикстуры `real_db`/`client`) реально
# выполнялись, а не уходили в `pytest.skip`. Это и есть страховка от backend-регресса,
# который иначе «маскируется» под зелёный прогон на пустом окружении.
# Один job, без матрицы версий; nightly live-smoke вынесен в nightly-smoke.yml.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check.sh (ruff · pytest · typecheck · vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `make install-py` + ruff (ruff не в requirements; check.sh ждёт его на PATH/в python).
      - name: Install Python deps (+ ruff)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt ruff

      # `make install-web` строгим `npm ci` (из package-lock.json) — детерминированно.
      - name: Install web deps
        working-directory: web
        run: npm ci

      # `make db`: собираем DuckDB из datasets/ready, чтобы интеграционные тесты
      # (client/real_db) шли против реальной базы, а не пропускались (skip).
      - name: Build DuckDB (make db)
        run: make db

      # Единый гейт: тот же скрипт, что и локально перед коммитом (анти-дрейф).
      - name: Run scripts/check.sh
        run: bash scripts/check.sh
